<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 345" width="600" height="345" role="img" aria-labelledby="t d"><title id="t">Observing emission from a gas discharge tube</title><desc id="d">A variable electrical supply powers a gas discharge tube. Light passes through a narrow slit and a grating; three emission lines are observed. The experiment compares two tube currents.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#243947"/></marker></defs><rect width="100%" height="100%" fill="white"/><style>text{font:19px Arial,sans-serif;fill:#213746}.small{font-size:16px}.axis{fill:none;stroke:#243947;stroke-width:2}.grid{stroke:#d9e1de;stroke-width:1}.wave{fill:none;stroke:#1e6c52;stroke-width:3}.other{fill:none;stroke:#5968a1;stroke-width:3;stroke-dasharray:8 5}</style><rect x="25" y="110" width="90" height="75" rx="12" fill="#f4e5ee" stroke="#243947"/><text x="70" y="225" text-anchor="middle" class="small">Gas tube</text><rect x="25" y="25" width="90" height="42" fill="#f0f3f2" stroke="#243947"/><text x="70" y="52" text-anchor="middle" class="small">Supply</text><path class="axis" d="M50 67V110M90 67V110M115 147H225" marker-end="url(#a)"/><path class="axis" d="M230 110V139M230 155V185M245 147H355" marker-end="url(#a)"/><path class="axis" d="M360 110V185M375 147H475" marker-end="url(#a)"/><text x="230" y="225" text-anchor="middle" class="small">Narrow slit</text><text x="360" y="225" text-anchor="middle" class="small">Grating</text><rect x="482" y="83" width="95" height="127" fill="#172d39"/><path d="M498 100V194" stroke="#b4a4fa" stroke-width="4"/><path d="M528 100V194" stroke="#81d28d" stroke-width="4"/><path d="M560 100V194" stroke="#ef8980" stroke-width="4"/><text x="530" y="248" text-anchor="middle" class="small">Observed</text><text x="530" y="269" text-anchor="middle" class="small">line spectrum</text><text x="300" y="315" text-anchor="middle" class="small">The same gas is observed at two supply-current settings.</text></svg>