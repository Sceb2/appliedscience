<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="600" height="350" role="img" aria-labelledby="t d"><title id="t">A driven stretched string</title><desc id="d">A vibration generator drives a stretched string attached to a fixed end. Travelling waves reflect from the fixed end. Solid and dashed curves show opposite extreme positions of a possible stationary pattern.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#243947"/></marker></defs><rect width="100%" height="100%" fill="white"/><style>text{font:19px Arial,sans-serif;fill:#213746}.small{font-size:16px}.axis{fill:none;stroke:#243947;stroke-width:2}.grid{stroke:#d9e1de;stroke-width:1}.wave{fill:none;stroke:#1e6c52;stroke-width:3}.other{fill:none;stroke:#5968a1;stroke-width:3;stroke-dasharray:8 5}</style><rect x="25" y="140" width="85" height="60" fill="#e5eee9" stroke="#243947"/><text x="65" y="232" text-anchor="middle" class="small">Vibration</text><text x="65" y="252" text-anchor="middle" class="small">generator</text><path class="axis" d="M110 169H520M520 95V240"/><text x="490" y="275" class="small">Fixed end</text><path class="wave" d="M110 169Q210 70 315 169T520 169"/><path class="other" d="M110 169Q210 268 315 169T520 169"/><text x="300" y="38" text-anchor="middle">Stretched string</text><text x="300" y="317" text-anchor="middle" class="small">The wave travels along the string and reflects at the fixed end.</text></svg>