<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 410" width="600" height="410" role="img" aria-labelledby="t d"><title id="t">Open and closed ends of air-filled pipes</title><desc id="d">Pipe A is open to the air at both ends. Pipe B has a solid cap at its left end and is open to the air at its right end. No displacement pattern is supplied.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#243947"/></marker></defs><rect width="100%" height="100%" fill="white"/><style>text{font:19px Arial,sans-serif;fill:#213746}.small{font-size:16px}.axis{fill:none;stroke:#243947;stroke-width:2}.grid{stroke:#d9e1de;stroke-width:1}.wave{fill:none;stroke:#1e6c52;stroke-width:3}.other{fill:none;stroke:#5968a1;stroke-width:3;stroke-dasharray:8 5}</style><text x="45" y="53">A: open at both ends</text><path class="axis" d="M95 95H505M95 157H505"/><text x="98" y="190" text-anchor="middle" class="small">Open to air</text><text x="500" y="190" text-anchor="middle" class="small">Open to air</text><text x="300" y="133" text-anchor="middle">Air inside pipe</text><text x="45" y="228">B: closed at the left end</text><path class="axis" d="M95 270H505M95 332H505"/><rect x="88" y="268" width="13" height="66" fill="#8b969c"/><text x="98" y="365" text-anchor="middle" class="small">Solid cap</text><text x="500" y="365" text-anchor="middle" class="small">Open to air</text><text x="300" y="308" text-anchor="middle">Air inside pipe</text></svg>