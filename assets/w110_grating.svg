<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 365" width="600" height="365" role="img" aria-labelledby="t d"><title id="t">Laser, diffraction grating and screen</title><desc id="d">Coherent light from a laser passes through a diffraction grating onto a screen. Bright spots are separated by dark regions. The diagram is schematic.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#243947"/></marker></defs><rect width="100%" height="100%" fill="white"/><style>text{font:19px Arial,sans-serif;fill:#213746}.small{font-size:16px}.axis{fill:none;stroke:#243947;stroke-width:2}.grid{stroke:#d9e1de;stroke-width:1}.wave{fill:none;stroke:#1e6c52;stroke-width:3}.other{fill:none;stroke:#5968a1;stroke-width:3;stroke-dasharray:8 5}</style><rect x="32" y="116" width="110" height="56" rx="8" fill="#f1e8d8" stroke="#243947"/><text x="87" y="149" text-anchor="middle">Laser</text><path d="M142 144H315" stroke="#c24b45" stroke-width="3" marker-end="url(#a)"/><path class="axis" d="M320 65V225M530 50V260"/><path d="M312 88h16" stroke="white" stroke-width="5"/><path d="M312 103h16" stroke="white" stroke-width="5"/><path d="M312 118h16" stroke="white" stroke-width="5"/><path d="M312 133h16" stroke="white" stroke-width="5"/><path d="M312 148h16" stroke="white" stroke-width="5"/><path d="M312 163h16" stroke="white" stroke-width="5"/><path d="M312 178h16" stroke="white" stroke-width="5"/><path d="M312 193h16" stroke="white" stroke-width="5"/><path d="M312 208h16" stroke="white" stroke-width="5"/><circle cx="530" cy="80" r="6" fill="#c24b45"/><circle cx="530" cy="115" r="6" fill="#c24b45"/><circle cx="530" cy="150" r="6" fill="#c24b45"/><circle cx="530" cy="185" r="6" fill="#c24b45"/><circle cx="530" cy="220" r="6" fill="#c24b45"/><text x="320" y="272" text-anchor="middle">Diffraction</text><text x="320" y="295" text-anchor="middle">grating</text><text x="530" y="295" text-anchor="middle">Screen</text><text x="300" y="340" text-anchor="middle" class="small">Schematic: alternate bright and dark regions are observed.</text></svg>