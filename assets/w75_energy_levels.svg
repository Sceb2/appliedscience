<svg xmlns="http://www.w3.org/2000/svg" width="560" height="320" viewBox="0 0 560 320" role="img" aria-labelledby="title desc"><title id="title">Two downward electron transitions</title><desc id="desc">Transition A falls from level 5 to level 2; transition B falls from level 2 to level 0.</desc><rect width="560" height="320" fill="white"/><style>text{font-family:Arial,sans-serif;font-size:21px;fill:#172d3a}.grid{stroke:#d5ded8;stroke-width:1}.axis{stroke:#172d3a;stroke-width:2}.wave{fill:none;stroke:#14563e;stroke-width:3.5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#14563e"/></marker></defs><text x="280" y="28" text-anchor="middle">Energy / arbitrary units</text><path class="axis" d="M110 50H500"/><text x="85" y="57" text-anchor="end">5</text><path class="axis" d="M110 185H500"/><text x="85" y="192" text-anchor="end">2</text><path class="axis" d="M110 275H500"/><text x="85" y="282" text-anchor="end">0</text><path d="M250 60V175M385 195V265" fill="none" stroke="#14563e" stroke-width="4" marker-end="url(#arrow)"/><text x="270" y="127">A</text><text x="405" y="237">B</text></svg>